<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>CityBikes History</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚲%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Pick the theme BEFORE React renders, so the page never flashes the
      // wrong colours. The key must match KEY in src/preferences.js.
      (function () {
        var theme = null;
        try {
          theme = JSON.parse(localStorage.getItem("cbh:prefs") || "{}").theme;
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          var light =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          theme = light ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
